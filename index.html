<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SimpleCI CD trigger -->
  <title>Thought of the Day</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="style.css?v=auto" />
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="container">
    <div class="badge">✨ Thoughts of the day  </div>

    <div class="card" id="card">
      <div class="quote-icon">"</div>
      <p class="thought" id="thought"></p>
      <div class="author" id="author"></div>
    </div>

    <div class="actions">
      <button class="btn" id="newBtn" onclick="newThought()">
        <span class="btn-icon">🔀</span> New Thought
      </button>
      <button class="btn btn-copy" id="copyBtn" onclick="copyThought()">
        <span class="btn-icon">📋</span> Copy
      </button>
    </div>

    <div class="counter">
      Thought <span id="num">1</span> of <span id="total"></span>
    </div>

    <footer>
      Powered by <strong>SimpleCI</strong> &mdash; a self-hosted CI/CD platform
    </footer>
  </div>

  <div class="toast" id="toast">Copied to clipboard! 📋</div>

  <script src="app.js?v=auto"></script>
</body>
</html>
